version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./backend/storage:/var/www/storage

  cnn-service:
    build: ./cnn-service
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
      - cnn-service
